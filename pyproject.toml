[project]
name = "flight-booking-agent"
version = "0.1.0"
description = "AI agent for flight booking with tool calling using local LLM via LM Studio"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",   # для ChatOpenAI с LM Studio
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "arize-phoenix>=19.18.0",    # опционально
]
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
[tool.ruff]
line-length = 120
target-version = "py311"