[project]
name = "flight-booking-agent"
version = "0.1.0"
description = "AI agent for flight booking and RAG with local LLM"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "arize-phoenix>=19.18.0",
    "sentence-transformers>=3.0.0",
    "dspy-ai>=2.5.0",
    "langchain-community>=0.3.0",
    "faiss-cpu>=1.8.0",
    "pypdf>=4.0.0",
    "tiktoken>=0.13.0",
]
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
[tool.ruff]
line-length = 120
target-version = "py311"